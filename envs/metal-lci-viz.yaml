name: metal-lci-viz
# The grid_workflow notebook (rule visualise_grid) needs BOTH a Brightway reader
# (its distribution-split cell reads the CH network-construction dataset comments
# straight from the store) AND the notebook/PyPSA-reading stack the rest of the
# notebook uses (nbconvert + papermill to execute, netcdf4 to open the .nc files).
#
# This is metal-lci.yaml plus those three additions, kept as a SEPARATE file on
# purpose: editing metal-lci.yaml changes its hash, and snakemake's software-env
# rerun trigger would then mark import_ecoinvent / build_premise / run_lci
# out-of-date and try to rebuild the ecoinvent + premise + LCI databases. The
# Brightway pins are copied verbatim so this env reads the store the LCI env wrote
# without version drift; keep them in step with metal-lci.yaml.
channels:
    - conda-forge
dependencies:
    - python=3.11
    - pip=25.0
    - ipdb=0.13.13 # replaces default debugger with IPython debugger
    - activity-browser=2.11.2
    # Pin numpy at the conda level (matching the pip pin below) so netcdf4's
    # compiled extension is built against numpy 1.26, not numpy 2. Without this,
    # conda builds netcdf4 for numpy 2, the pip block downgrades numpy to 1.26.4,
    # and the ABI mismatch breaks `import netCDF4` (No module named netCDF4._netCDF4).
    - numpy=1.26.4
    - netcdf4=1.7.4    # xarray netCDF engine: open the PyPSA all_scenarios.nc
    - ipykernel=7.3.0  # provides the env's own `python3` kernelspec (used by papermill and by VS Code / Jupyter)
    - nbconvert=7.17.1 # snakemake notebook-rule execution
    - papermill=2.7.0  # what snakemake reaches for first to execute a notebook
    - pip:
      - premise[bw2]==2.3.0  # 2.4.x changes the battery Li/Co/Mn/V inventories
      - wurst==0.4           # wurst 0.5 (2025-10-27) breaks 2.3.0: extract_brightway2_databases -> None
      - pandas==2.3.3        # premise 2.3.0 predates pandas 3
      - bw2calc==1.8.2
      - bw2data==3.6.6
      - bw2io==0.8.12
      - numpy==1.26.4
      - openpyxl==3.1.5
