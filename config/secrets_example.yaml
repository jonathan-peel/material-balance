# Copy this file to config/secrets.yaml and fill in the values.
# config/secrets.yaml is gitignored and never committed.
#
# Each value can also be supplied via an environment variable, which takes
# precedence over this file:
#   ECOINVENT_USERNAME, ECOINVENT_PASSWORD, PREMISE_KEY

# ecoinvent (ecoquery) credentials used by rule import_ecoinvent
ecoinvent_username: username
ecoinvent_password: password

# premise decryption key used by rule build_premise_db
premise_key: key
